<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">How Leverframe fits together</title>
  <desc id="d">MCP clients such as Claude Code and Zed connect to fleet-bridge, a stdio MCP server with gated levers, which connects to the OpenClaw gateway and Hermes agent runtimes. Below, wranglebot and tractum emit records in the open .curt conversation format.</desc>
  <style>
    .bg { fill: #f8f9f8; }
    .panel { fill: #eef1ee; stroke: #c4cec7; stroke-width: 1.5; }
    .frame { fill: #eef1ee; stroke: #b07d0a; stroke-width: 2.5; }
    .strip { fill: none; stroke: #c4cec7; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .line { stroke: #66736c; stroke-width: 2; fill: none; }
    .arrow { fill: #66736c; }
    .slot { stroke: #c4cec7; stroke-width: 7; stroke-linecap: round; }
    .rail { stroke: #b07d0a; stroke-width: 2; opacity: .55; }
    .knob-a { fill: #b07d0a; }
    .knob-g { fill: #5a7a2e; }
    .pill { fill: #eef1ee; stroke: #5a7a2e; stroke-width: 2.5; }
    text { fill: #2d353b; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
    .h { font-size: 13px; fill: #66736c; letter-spacing: .3px; }
    .name { font-size: 17px; }
    .big { font-size: 22px; }
    .sub { font-size: 12.5px; fill: #66736c; }
    .tag { font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e2327; }
      .panel { fill: #272e33; stroke: #3d484d; }
      .frame { fill: #272e33; stroke: #dbbc7f; }
      .strip { stroke: #3d484d; }
      .line { stroke: #859289; }
      .arrow { fill: #859289; }
      .slot { stroke: #3d484d; }
      .rail { stroke: #dbbc7f; }
      .knob-a { fill: #dbbc7f; }
      .knob-g { fill: #a7c080; }
      .pill { fill: #272e33; stroke: #a7c080; }
      text { fill: #d3c6aa; }
      .h, .sub { fill: #859289; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="540" rx="16"/>

  <!-- column headings -->
  <text class="h" x="150" y="48" text-anchor="middle">MCP clients</text>
  <text class="h" x="480" y="48" text-anchor="middle">The interlocking</text>
  <text class="h" x="810" y="48" text-anchor="middle">Agent runtimes</text>

  <!-- clients -->
  <rect class="panel" x="50" y="80" width="200" height="64" rx="10"/>
  <text class="mono name" x="150" y="118" text-anchor="middle">Claude Code</text>
  <rect class="panel" x="50" y="176" width="200" height="64" rx="10"/>
  <text class="mono name" x="150" y="214" text-anchor="middle">Zed / other</text>

  <!-- runtimes -->
  <rect class="panel" x="710" y="80" width="200" height="64" rx="10"/>
  <text class="mono name" x="810" y="118" text-anchor="middle">OpenClaw gateway</text>
  <rect class="panel" x="710" y="176" width="200" height="64" rx="10"/>
  <text class="mono name" x="810" y="214" text-anchor="middle">Hermes</text>

  <!-- connectors -->
  <path class="line" d="M252 112 L368 132" marker-end="url(#ah)"/>
  <path class="line" d="M252 208 L368 188" marker-end="url(#ah)"/>
  <path class="line" d="M592 132 L708 112" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path class="line" d="M592 188 L708 208" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- fleet-bridge: the lever frame -->
  <rect class="frame" x="370" y="72" width="220" height="190" rx="12"/>
  <text class="mono big" x="480" y="106" text-anchor="middle">fleet-bridge</text>
  <text class="sub" x="480" y="126" text-anchor="middle">one stdio MCP server</text>

  <line class="rail" x1="404" y1="152" x2="556" y2="152"/>
  <g>
    <line class="slot" x1="414" y1="156" x2="414" y2="196"/><circle class="knob-g" cx="414" cy="192" r="8"/>
    <line class="slot" x1="447" y1="156" x2="447" y2="196"/><circle class="knob-a" cx="447" cy="160" r="8"/>
    <line class="slot" x1="480" y1="156" x2="480" y2="196"/><circle class="knob-g" cx="480" cy="192" r="8"/>
    <line class="slot" x1="513" y1="156" x2="513" y2="196"/><circle class="knob-g" cx="513" cy="192" r="8"/>
    <line class="slot" x1="546" y1="156" x2="546" y2="196"/><circle class="knob-a" cx="546" cy="160" r="8"/>
  </g>
  <text class="sub" x="480" y="228" text-anchor="middle">every lever gated and audited</text>
  <text class="sub" x="480" y="246" text-anchor="middle">no two can conflict</text>

  <!-- emitters strip -->
  <rect class="strip" x="50" y="296" width="860" height="188" rx="12"/>
  <text class="h" x="72" y="322">Emitters on the open .curt format</text>

  <rect class="panel" x="80" y="336" width="330" height="58" rx="10"/>
  <text class="mono name" x="98" y="361">wranglebot</text>
  <text class="sub" x="98" y="381">Guardrails and loop-breaking for coding agents</text>

  <rect class="panel" x="80" y="410" width="330" height="58" rx="10"/>
  <text class="mono name" x="98" y="435">tractum</text>
  <text class="sub" x="98" y="455">Signed k-of-n consensus receipts for Claude</text>

  <path class="line" d="M412 365 L640 392" marker-end="url(#ah)"/>
  <path class="line" d="M412 439 L640 408" marker-end="url(#ah)"/>

  <rect class="pill" x="642" y="368" width="236" height="64" rx="32"/>
  <text class="mono big" x="760" y="396" text-anchor="middle">.curt</text>
  <text class="sub" x="760" y="416" text-anchor="middle">decisions and receipts, one format</text>

  <!-- tagline -->
  <text class="tag" x="480" y="516" text-anchor="middle">Two agent runtimes. One MCP interface. Every lever gated.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
