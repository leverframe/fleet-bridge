<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <!-- LEVERFRAME LOADER — steel lever pivots about the round pivot end, amber ball rides the grip.
       Pull = invoking an agent. 2.2s loop; throw escapes over the frame edge (margin ring absorbs it). -->
  <style>
    @keyframes lf-throw { 0% { transform: rotate(-6deg); } 55% { transform: rotate(34deg); } 100% { transform: rotate(-6deg); } }
    .lf-lever { transform-origin: 67px 75px; animation: lf-throw 2.2s cubic-bezier(.6, 0, .3, 1) infinite; }
  </style>
  <rect width="150" height="150" rx="32" fill="#1B1D1F"/>
  <rect x="15" y="15" width="120" height="120" rx="12" fill="#FFB000"/>
  <g transform="translate(67,75) rotate(30)">
    <path d="M -11 -80 L -11 0 A 11 11 0 0 0 11 0 L 11 -80 Z" fill="#1B1D1F"/>
  </g>
  <g class="lf-lever">
    <g transform="translate(67,75)">
      <rect x="-5" y="-58" width="10" height="58" rx="5" fill="#C2C7CC"/>
      <circle cx="0" cy="-58" r="9" fill="#FFB000" stroke="#1B1D1F" stroke-width="3"/>
    </g>
  </g>
</svg>
